<!-- Photo of a person: a contained card (.shot.face), text above and below, never on the face, never a border, no tilt.
     Replace sample/photo.svg with a real photo in the story folder, or the QA gate fails on a missing image. -->
<div class="stack">
  <div class="box white"><span>ככה נראה יום עבודה אצלי <img class="emo" src="emo:sunglasses"></span></div>
  <div class="shot face" style="width:620px"><img src="sample/photo.svg"></div>
  <div class="box blue"><span>ולמחר כבר יש תוכנית</span></div>
</div></body></html>
